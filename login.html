<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - குரல்தோழன்</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-6 md:p-8 rounded-xl shadow-md w-80 md:w-96">
    
    <!-- Logo -->
    <div class="flex justify-center mb-4">
      <div class="w-20 h-20 rounded-full overflow-hidden border-4 border-green-700 shadow-md">
        <img src="kuralthozhan icon.png" alt="Logo" class="w-full h-full object-cover">
      </div>
    </div>

    <h2 class="text-2xl font-bold text-green-700 mb-2 text-center">உள்நுழைக</h2>
    <p class="text-gray-600 text-sm mb-6 text-center">
      உங்கள் கைபேசி எண் மற்றும் கடவுச்சொல்லை பயன்படுத்தி உள்நுழையவும்
    </p>

    <!-- Login Form -->
    <form id="loginForm" class="flex flex-col gap-4">
      <input type="tel" placeholder="கைபேசி எண்"
             required pattern="[0-9]{10}"
             class="px-4 py-2 border rounded-lg">

      <input type="password" placeholder="கடவுச்சொல்"
             required
             class="px-4 py-2 border rounded-lg">

      <button type="submit"
              class="px-4 py-2 bg-green-700 text-white rounded-lg">
        உள்நுழைக
      </button>
    </form>

    <div class="mt-4 flex justify-between text-sm text-green-700">
      <a href="#" class="hover:underline">கடவுச்சொல் மறந்துவிட்டீர்களா?</a>
      <a href="register.html" class="hover:underline">பதிவு செய்யவும்</a>
    </div>
  </div>

  <!-- Redirect Script -->
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault(); // stop form refresh
      window.location.href = "home.html";
    });
  </script>

</body>
</html>
