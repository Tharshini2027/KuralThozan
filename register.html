<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - குரல்தோழன்</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-6 rounded-xl shadow-md w-80">
  <div class="flex justify-center mb-4">
    <div class="w-20 h-20 rounded-full overflow-hidden border-4 border-green-700">
      <img src="kuralthozhan icon.png" class="w-full h-full object-cover">
    </div>
  </div>

  <h2 class="text-2xl font-bold text-green-700 text-center">பதிவு செய்யவும்</h2>

  <form id="registerForm" class="flex flex-col gap-4 mt-4">
    <input name="name" type="text" placeholder="பெயர்" required class="border p-2 rounded">
    <input name="mobile" type="tel" placeholder="கைபேசி எண்" required pattern="[0-9]{10}" class="border p-2 rounded">
    <input name="password" type="password" placeholder="கடவுச்சொல்" required class="border p-2 rounded">
    <input type="password" placeholder="மீண்டும் கடவுச்சொல்" required class="border p-2 rounded">
    <button onclick="window.location.href='home.html'" class="px-4 py-2 bg-green-700 text-white rounded-lg">உள்நுழைக</button>

  </form>

  <p class="text-center text-sm mt-3">
    ஏற்கனவே கணக்கு உள்ளதா? <a href="home.html" class="text-green-700">உள்நுழைக</a>
  </p>
</div>



</body>
</html>
